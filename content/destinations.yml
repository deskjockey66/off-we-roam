- country: Canada
  note: Our current chapter, with Brisbane still home. We started our family sabbatical
    in February 2026 and spent about six months based in Canmore, exploring the Rockies
    and making shorter trips away. Our first published pieces cover the lakes and
    Lake Louise Resort.
